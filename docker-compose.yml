services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port on purpose: only the API (and the optional viewer) reach the database, inside Docker.
    # This avoids a clash with a PostgreSQL that may already run on the computer (port 5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/MeridianVoteTracker.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=meridian;Username=meridian;Password=${POSTGRES_PASSWORD:-meridian_local}
      Storage__UploadDirectory: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"

  # Optional database viewer for development: docker compose --profile tools up -d adminer
  # It is not started by a plain "docker compose up".
  adminer:
    image: adminer:4
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  pgdata:
  uploads:
