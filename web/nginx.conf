server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The historic CSV is about 100 MB.
  client_max_body_size 600m;

  # The browser talks to one address; nginx forwards API calls to the API container.
  # No CORS settings are needed because the page and the API share an origin.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Angular handles its own routes: unknown paths return index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
